version: '3.8'

services:
  nkb_client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nkb_client_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Manila
      - DB_DRIVER=sqlite
      - DATABASE_PATH=/app/database/nkb.sqlite
      - JWT_SECRET=nkb-manufacturing-production-jwt-secure-key-2026-b2b-portal
      - COOKIE_SECURE=false
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
      - ./public:/app/public
      - ./routes:/app/routes
      - ./services:/app/services
      - ./helpers:/app/helpers
      - ./middleware:/app/middleware
      - ./server.js:/app/server.js
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - nkb_client_net

networks:
  nkb_client_net:
    driver: bridge
