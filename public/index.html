<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NKB Manufacturing & Trading - Portal Login</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        *, *:before, *:after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            font-size: 62.5%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f172a;
        }

        @media (max-width: 768px) {
            html, body {
                font-size: 50%;
            }
        }

        svg {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            overflow: visible;
        }

        .svg-icon {
            cursor: pointer;
        }

        .svg-icon path {
            stroke: rgba(255, 255, 255, 0.9);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        input, button {
            outline: none;
            border: none;
            font-family: inherit;
        }

        .cont {
            position: relative;
            height: 100%;
            background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.78), rgba(30, 27, 75, 0.85)), url('/images/nkb-facility-bg.jpg');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .demo {
            position: relative;
            width: 32rem;
            height: 56rem;
            overflow: hidden;
            border-radius: 2.8rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 35px rgba(217, 119, 6, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login {
            position: relative;
            height: 100%;
            background: linear-gradient(to bottom, rgba(30, 27, 75, 0.88) 0%, rgba(15, 23, 42, 0.95) 100%);
            transition: opacity 0.2s, transform 0.35s cubic-bezier(0.17, -0.65, 0.665, 1.25);
            transform: scale(1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .login.inactive {
            opacity: 0;
            transform: scale(1.1);
        }

        /* Branding Top in Login */
        .login__brand {
            position: absolute;
            top: 4rem;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 0 2rem;
        }

        .login__logo {
            height: 6rem;
            width: auto;
            margin: 0 auto 0.8rem;
            display: block;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
        }

        .login__title {
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .login__subtitle {
            font-size: 1.05rem;
            color: #fbbf24;
            margin-top: 0.2rem;
            font-weight: 600;
        }

        .login__form {
            position: absolute;
            top: 48%;
            left: 0;
            width: 100%;
            padding: 1.5rem 3rem;
            text-align: center;
        }

        .login__row {
            height: 5.2rem;
            padding-top: 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            transition: border-color 0.3s;
        }

        .login__row:focus-within {
            border-bottom-color: #fbbf24;
        }

        .login__icon {
            margin-right: 1rem;
            flex-shrink: 0;
        }

        .login__icon.name path {
            stroke-dasharray: 73.5;
            stroke-dashoffset: 73.5;
            animation: animatePath 1.8s 0.3s forwards;
        }

        .login__icon.pass path {
            stroke-dasharray: 92.1;
            stroke-dashoffset: 92.1;
            animation: animatePath 1.8s 0.3s forwards;
        }

        .login__input {
            display: inline-block;
            width: 100%;
            height: 100%;
            padding-left: 0.5rem;
            font-size: 1.35rem;
            background: transparent;
            color: #FDFCFD;
        }

        .login__input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Error Message Banner */
        .login__error {
            display: none;
            margin-top: 1.2rem;
            padding: 0.8rem;
            background: rgba(244, 63, 94, 0.25);
            border: 1px solid rgba(244, 63, 94, 0.5);
            border-radius: 1rem;
            color: #fecdd3;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            animation: shake 0.3s ease;
        }

        .login__submit {
            position: relative;
            width: 100%;
            height: 4.4rem;
            margin: 3.5rem 0 1.8rem;
            color: #ffffff;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            font-size: 1.45rem;
            font-weight: 800;
            border-radius: 3rem;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
            transition: width 0.3s 0.15s, font-size 0.1s 0.15s, transform 0.2s, background 0.3s;
        }

        .login__submit:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .login__submit:after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            margin-left: -1.4rem;
            margin-top: -1.4rem;
            width: 2.8rem;
            height: 2.8rem;
            border: 2px dotted #fff;
            border-radius: 50%;
            border-left: none;
            border-bottom: none;
            transition: opacity 0.1s 0.4s;
            opacity: 0;
        }

        .login__submit.processing {
            width: 4.4rem;
            font-size: 0;
            border-radius: 50%;
        }

        .login__submit.processing:after {
            opacity: 1;
            animation: rotate 0.6s 0.2s infinite linear;
        }

        .login__submit.success {
            transition: transform 0.4s 0.1s ease-out, opacity 0.1s 0.3s, background-color 0.1s 0.3s;
            transform: scale(32);
            opacity: 0.95;
            background: #10b981;
        }

        .login__submit.success:after {
            transition: opacity 0.1s 0s;
            opacity: 0;
            animation: none;
        }

        .login__signup {
            font-size: 1.15rem;
            color: #94a3b8;
            margin-top: 0.5rem;
        }

        .login__signup a {
            color: #fbbf24;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
        }

        .login__signup a:hover {
            text-decoration: underline;
        }

        /* App Dashboard Container (Slide-in) */
        .app {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            display: none;
            transition: opacity 0.2s, transform 0.35s cubic-bezier(0.68, -0.45, 0.465, 1.25);
            transform: scale(1.2);
            background: #0f172a;
        }

        .app.active {
            opacity: 1;
            transform: scale(1);
        }

        .app__top {
            position: relative;
            height: 26rem;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            padding: 4rem 2rem 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .app__user {
            position: relative;
            display: inline-block;
            width: 8rem;
            height: 8rem;
            margin-bottom: 1.5rem;
        }

        .app__user-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #fbbf24;
            padding: 4px;
            background: #020617;
            object-fit: contain;
            transition: transform 0.3s 0.2s cubic-bezier(.62,.35,.56,1.55);
            transform: scale(1);
        }

        .app__hello {
            font-size: 1.8rem;
            color: #fff;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .app__role {
            font-size: 1.15rem;
            color: #a5b4fc;
            font-weight: 600;
        }

        .app__bot {
            position: relative;
            height: 30rem;
            background: #ffffff;
            padding: 2rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .app__status-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 1rem;
        }

        .app__item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 1.2rem;
            padding: 1.2rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 1rem;
        }

        .app__item-icon {
            font-size: 2rem;
        }

        .app__item-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
        }

        .app__item-desc {
            font-size: 1.05rem;
            color: #64748b;
        }

        .app__enter-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 800;
            border-radius: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
            transition: all 0.2s;
        }

        .app__enter-btn:hover {
            filter: brightness(1.1);
        }

        .ripple {
            position: absolute;
            width: 15rem;
            height: 15rem;
            margin-left: -7.5rem;
            margin-top: -7.5rem;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: animRipple 0.4s ease-out;
            border-radius: 50%;
            pointer-events: none;
        }

        @keyframes animRipple {
            to {
                transform: scale(3.5);
                opacity: 0;
            }
        }

        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes animatePath {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

<div class="cont">
    <div class="demo">
        <!-- LOGIN CARD -->
        <div class="login">
            <div class="login__brand">
                <img src="/images/nkb-logo.png" alt="NKB Manufacturing Logo" class="login__logo">
                <h1 class="login__title">NKB Manufacturing</h1>
                <p class="login__subtitle">Cosmetics ERP & Invoicing</p>
            </div>

            <form id="login-form" class="login__form">
                <div class="login__row">
                    <svg class="login__icon name svg-icon" viewBox="0 0 20 20">
                        <path d="M0,20 a10,8 0 0,1 20,0z M10,0 a4,4 0 0,1 0,8 a4,4 0 0,1 0,-8" />
                    </svg>
                    <input type="email" id="email" class="login__input name" placeholder="Corporate Email" required autocomplete="email" />
                </div>
                <div class="login__row">
                    <svg class="login__icon pass svg-icon" viewBox="0 0 20 20">
                        <path d="M0,20 20,20 20,8 0,8z M10,13 10,16z M4,8 a6,8 0 0,1 12,0" />
                    </svg>
                    <input type="password" id="password" class="login__input pass" placeholder="Password" required autocomplete="current-password" />
                </div>

                <div id="login-error" class="login__error"></div>

                <button type="submit" id="btn-login" class="login__submit">Sign In</button>
                <p class="login__signup">Support / Access Assistance? &nbsp;<a href="javascript:void(0)" onclick="alert('For access assistance or account setup, please contact IT Administration at support@nkbmanufacturing.com')">Help</a></p>
            </form>
        </div>

        <!-- APP TRANSFORMATION CONTAINER -->
        <div class="app">
            <div class="app__top">
                <div class="app__user">
                    <img src="/images/nkb-logo.png" alt="User Avatar" class="app__user-photo" />
                </div>
                <p class="app__hello" id="app-user-name">Welcome Back!</p>
                <p class="app__role" id="app-user-role">Authenticated User</p>
            </div>
            <div class="app__bot">
                <div>
                    <h2 class="app__status-title">Session Authorized</h2>
                    <div class="app__item">
                        <div class="app__item-icon">🔐</div>
                        <div>
                            <div class="app__item-title">Enterprise Security</div>
                            <div class="app__item-desc">Secure JWT Token Verified</div>
                        </div>
                    </div>
                    <div class="app__item">
                        <div class="app__item-icon">🚀</div>
                        <div>
                            <div class="app__item-title">Ready for Access</div>
                            <div class="app__item-desc">Redirecting to workspace...</div>
                        </div>
                    </div>
                </div>

                <button type="button" id="btn-enter" class="app__enter-btn">Open Workspace →</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('nkb_token');
        if (token) {
            try {
                const res = await NKB.api('/api/auth/me');
                if (res.success && res.user) {
                    redirectByRole(res.user.role);
                }
            } catch (e) {}
        }
    });

    function redirectByRole(role) {
        if (role === 'CLIENT') {
            window.location.href = '/client.html';
        } else {
            window.location.href = '/admin.html';
        }
    }

    function createRipple(elem, e) {
        const old = elem.querySelector('.ripple');
        if (old) old.remove();

        const rect = elem.getBoundingClientRect();
        const x = (e.clientX || rect.left + rect.width / 2) - rect.left;
        const y = (e.clientY || rect.top + rect.height / 2) - rect.top;

        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        elem.appendChild(ripple);
    }

    let isSubmitting = false;

    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        if (isSubmitting) return;

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const submitBtn = document.getElementById('btn-login');
        const errEl = document.getElementById('login-error');
        const loginCard = document.querySelector('.login');
        const appCard = document.querySelector('.app');

        errEl.style.display = 'none';
        isSubmitting = true;

        // Visual Ripple & Processing state
        createRipple(submitBtn, e);
        submitBtn.classList.add('processing');

        try {
            const res = await NKB.api('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ email, password }).toString()
            });

            if (res.success && res.token) {
                // Save session
                localStorage.setItem('nkb_token', res.token);
                localStorage.setItem('nkb_user', JSON.stringify(res.user));
                NKB.token = res.token;
                NKB.user = res.user;

                // Update app transition info
                document.getElementById('app-user-name').textContent = res.user.name || 'Welcome!';
                document.getElementById('app-user-role').textContent = (res.user.role || 'USER').replace('_', ' ');

                // Trigger smooth button expansion & card morph
                setTimeout(() => {
                    submitBtn.classList.add('success');

                    setTimeout(() => {
                        appCard.style.display = 'block';
                        void appCard.offsetWidth; // force reflow
                        appCard.classList.add('active');
                    }, 330);

                    setTimeout(() => {
                        loginCard.style.display = 'none';
                        loginCard.classList.add('inactive');
                        isSubmitting = false;
                        submitBtn.classList.remove('success', 'processing');

                        // Smooth automatic redirect to role portal
                        setTimeout(() => {
                            redirectByRole(res.user.role);
                        }, 700);
                    }, 400);

                }, 900);

            } else {
                setTimeout(() => {
                    submitBtn.classList.remove('processing');
                    isSubmitting = false;
                    errEl.textContent = res.error || res.message || 'Invalid email or password.';
                    errEl.style.display = 'block';
                }, 600);
            }
        } catch (err) {
            setTimeout(() => {
                submitBtn.classList.remove('processing');
                isSubmitting = false;
                errEl.textContent = err.message || 'Connection failed. Please check network.';
                errEl.style.display = 'block';
            }, 600);
        }
    });

    document.getElementById('btn-enter').addEventListener('click', () => {
        const user = JSON.parse(localStorage.getItem('nkb_user') || '{}');
        redirectByRole(user.role);
    });
</script>
</body>
</html>
